# Builds the hisabkhata app on GitHub's machines:
#  - iPhone:  hisabkhata.ipa — unsigned; sign + install it with Sideloadly/AltStore and a free Apple ID
#  - Android: hisabkhata.apk — release build, installs directly
# Download both from the run's "Artifacts" section. Pushing a tag like v1.0.0
# also attaches them to a GitHub Release.
name: hisabkhata

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: hisabkhata-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: hisabkhata

jobs:
  ios:
    name: hisabkhata (iPhone)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: |
          flutter analyze
          flutter test

      - name: Build for iPhone (no signing)
        run: flutter build ios --release --no-codesign

      - name: Package hisabkhata.ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr "$APP_NAME.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: hisabkhata-ios
          path: build/ipa/hisabkhata.ipa
          retention-days: 30

  android:
    name: hisabkhata (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build hisabkhata.apk
        run: |
          flutter pub get
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$APP_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: hisabkhata-android
          path: build/app/outputs/flutter-apk/hisabkhata.apk
          retention-days: 30

  release:
    name: hisabkhata (GitHub Release, tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hisabkhata.ipa
            dist/hisabkhata.apk
